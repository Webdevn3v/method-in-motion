<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zen's CSS Challenge — Method in Motion</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --accent:#f472b6;
  --accent2:#a855f7;
  --bg:#0a0008;
  --surface:rgba(15,10,25,0.82);
  --card:rgba(20,10,30,0.88);
  --border:rgba(244,114,182,0.18);
  --text:#e8e8f5;
  --muted:#7a6a80;
  --green:#4ade80;
  --red:#f87171;
  --yellow:#fbbf24;
  --cyan:#00f5d4;
}
html,body{height:100%;margin:0;}
body{
  font-family:'Syne',sans-serif;
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}

/* WORLD BACKGROUND */
.world-bg{
  position:fixed;
  inset:0;
  background-image:url('zen-entrance.png');
  background-size:cover;
  background-position:center top;
  z-index:0;
}
.world-overlay{
  position:fixed;
  inset:0;
  background:linear-gradient(to bottom,rgba(10,0,8,0.55) 0%,rgba(10,0,8,0.7) 50%,rgba(10,0,8,0.92) 100%);
  z-index:1;
}
.world-glow{
  position:fixed;
  inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(244,114,182,0.12) 0%,transparent 60%);
  z-index:1;
  pointer-events:none;
}

/* CONTENT */
.content{position:relative;z-index:10;}

/* NAV */
nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;
  background:rgba(10,0,8,0.7);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.nav-left{display:flex;align-items:center;gap:16px;}
.nav-back{font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.4);text-decoration:none;transition:color 0.2s;}
.nav-back:hover{color:var(--accent);}
.nav-title{font-family:'Orbitron',monospace;font-size:0.75rem;letter-spacing:0.15em;color:var(--accent);text-shadow:0 0 20px rgba(244,114,182,0.5);}
.nav-tier{font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent2);border:1px solid rgba(168,85,247,0.4);padding:3px 10px;border-radius:4px;}

.game-shell{max-width:1200px;margin:0 auto;padding:28px 24px;}

/* ZEN QUOTE */
.char-quote{
  background:rgba(244,114,182,0.06);
  border:1px solid rgba(244,114,182,0.2);
  backdrop-filter:blur(12px);
  border-radius:14px;
  padding:14px 20px;
  margin-bottom:20px;
  display:flex;align-items:center;gap:14px;
}
.char-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;box-shadow:0 0 20px rgba(244,114,182,0.4);}
.char-text{font-size:0.82rem;color:rgba(255,255,255,0.6);line-height:1.6;font-style:italic;}
.char-text strong{color:var(--accent);font-style:normal;}

/* LEVEL HEADER */
.level-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.level-badge{font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:0.15em;color:var(--accent);border:1px solid rgba(244,114,182,0.3);padding:5px 14px;border-radius:4px;background:rgba(244,114,182,0.06);backdrop-filter:blur(8px);}
.level-title{font-size:1.1rem;font-weight:800;}
.level-desc{font-size:0.8rem;color:var(--muted);margin-top:2px;}
.score-bar{display:flex;align-items:center;gap:20px;}
.score-item{text-align:center;}
.score-val{font-family:'Orbitron',monospace;font-size:1.1rem;font-weight:900;color:var(--accent);}
.score-label{font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}
#timer-val.warning{color:var(--yellow);}
#timer-val.danger{color:var(--red);animation:pulse 0.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}

.progress-dots{display:flex;gap:8px;align-items:center;}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.1);transition:background 0.3s;}
.dot.active{background:var(--accent);box-shadow:0 0 8px var(--accent);}
.dot.done{background:var(--green);}

/* PANELS */
.panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  backdrop-filter:blur(16px);
}
.panel-header{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.panel-label{font-family:'Orbitron',monospace;font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);}
.panel-label span{color:var(--accent);}

.game-area{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
.target-preview{padding:28px;display:flex;align-items:center;justify-content:center;min-height:220px;background:#fff;}

.hint-btn{font-size:0.65rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);background:none;border:1px solid rgba(255,255,255,0.1);padding:4px 12px;border-radius:4px;cursor:pointer;transition:all 0.2s;}
.hint-btn:hover{border-color:var(--accent);color:var(--accent);}
.hint-used{color:var(--red);border-color:rgba(248,113,113,0.3);}

.css-editor{width:100%;min-height:220px;background:rgba(5,0,10,0.7);border:none;outline:none;padding:18px;font-family:'DM Mono',monospace;font-size:0.82rem;color:#e8e8f5;line-height:1.7;resize:none;tab-size:2;}
.css-editor::placeholder{color:var(--muted);}

.preview-panel{margin-bottom:20px;}
.live-preview{padding:28px;display:flex;align-items:center;justify-content:center;min-height:160px;background:#fff;border-radius:0 0 12px 12px;}

.feedback-bar{padding:12px 18px;border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;min-height:48px;}
.accuracy-label{font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}
.accuracy-track{flex:1;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;}
.accuracy-fill{height:100%;border-radius:3px;transition:width 0.3s,background 0.3s;width:0%;}
.accuracy-pct{font-family:'Orbitron',monospace;font-size:0.75rem;color:var(--text);min-width:40px;text-align:right;}

.hint-box{display:none;background:rgba(168,85,247,0.08);border:1px solid rgba(168,85,247,0.25);border-radius:8px;padding:14px 18px;margin-bottom:16px;font-size:0.82rem;color:var(--text);line-height:1.7;backdrop-filter:blur(8px);}
.hint-box strong{color:var(--accent2);}

.action-row{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;}
.btn{font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:0.12em;text-transform:uppercase;padding:11px 24px;border-radius:6px;cursor:pointer;border:none;transition:all 0.2s;}
.btn-primary{background:var(--accent);color:#000;font-weight:700;}
.btn-primary:hover{opacity:0.85;transform:translateY(-1px);box-shadow:0 8px 20px rgba(244,114,182,0.4);}
.btn-secondary{background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--muted);}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn-next{background:var(--green);color:#000;font-weight:700;display:none;}
.btn-next:hover{opacity:0.85;}

.result-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;align-items:center;justify-content:center;backdrop-filter:blur(8px);}
.result-overlay.show{display:flex;}
.result-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;max-width:480px;width:90%;text-align:center;backdrop-filter:blur(20px);}
.result-icon{font-size:3rem;margin-bottom:16px;}
.result-title{font-family:'Orbitron',monospace;font-size:1.1rem;letter-spacing:0.1em;margin-bottom:8px;}
.result-title.win{color:var(--green);}
.result-title.fail{color:var(--red);}
.result-score{font-family:'Orbitron',monospace;font-size:2rem;font-weight:900;color:var(--accent);margin-bottom:24px;}
.result-msg{font-size:0.88rem;color:var(--muted);line-height:1.7;margin-bottom:24px;}
.result-actions{display:flex;gap:12px;justify-content:center;}

@media(max-width:768px){.game-area{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="world-bg"></div>
<div class="world-overlay"></div>
<div class="world-glow"></div>

<div class="content">
<nav>
  <div class="nav-left">
    <a href="games.html" class="nav-back">← Game Universe</a>
    <span class="nav-title">CSS Challenge</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="progress-dots" id="progress-dots">
      <div class="dot active" id="dot-0"></div>
      <div class="dot" id="dot-1"></div>
      <div class="dot" id="dot-2"></div>
    </div>
    <span class="nav-tier">Coders</span>
  </div>
</nav>

<div class="game-shell">
  <div class="char-quote">
    <div class="char-avatar">🌸</div>
    <div class="char-text" id="zen-text">Loading challenge...</div>
  </div>

  <div class="level-header">
    <div style="display:flex;align-items:center;gap:16px;">
      <div class="level-badge" id="level-badge">LEVEL 1</div>
      <div>
        <div class="level-title" id="level-title">Loading...</div>
        <div class="level-desc" id="level-desc"></div>
      </div>
    </div>
    <div class="score-bar">
      <div class="score-item"><div class="score-val" id="timer-val" style="color:var(--cyan)">90</div><div class="score-label">Seconds</div></div>
      <div class="score-item"><div class="score-val" id="score-val">0</div><div class="score-label">Score</div></div>
    </div>
  </div>

  <div class="hint-box" id="hint-box"></div>

  <div class="game-area">
    <div class="panel">
      <div class="panel-header">
        <div class="panel-label"><span>TARGET</span> — Match this design</div>
      </div>
      <div class="target-preview" id="target-preview"></div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <div class="panel-label"><span>YOUR CSS</span> — Write it here</div>
        <button class="hint-btn" id="hint-btn" onclick="showHint()">Use Hint (−50pts)</button>
      </div>
      <textarea class="css-editor" id="css-editor" placeholder="/* Style the .box element */&#10;.box {&#10;  &#10;}" spellcheck="false"></textarea>
      <div class="feedback-bar">
        <span class="accuracy-label">Accuracy</span>
        <div class="accuracy-track"><div class="accuracy-fill" id="accuracy-fill"></div></div>
        <span class="accuracy-pct" id="accuracy-pct">0%</span>
      </div>
    </div>
  </div>

  <div class="panel preview-panel">
    <div class="panel-header">
      <div class="panel-label"><span>LIVE PREVIEW</span> — Updates as you type</div>
      <div id="match-status" style="font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);"></div>
    </div>
    <div class="live-preview" id="live-preview"></div>
  </div>

  <div class="action-row">
    <button class="btn btn-secondary" onclick="resetLevel()">Reset</button>
    <button class="btn btn-primary" onclick="checkAnswer()">Check Answer</button>
    <button class="btn btn-next" id="btn-next" onclick="nextLevel()">Next Level →</button>
  </div>
</div>
</div>

<div class="result-overlay" id="result-overlay">
  <div class="result-box">
    <div class="result-icon" id="result-icon"></div>
    <div class="result-title" id="result-title"></div>
    <div class="result-score" id="result-score"></div>
    <div class="result-msg" id="result-msg"></div>
    <div class="result-actions" id="result-actions"></div>
  </div>
</div>

<script>
const LEVELS = [
  {
    id:0,title:'Style a Button',desc:'Make the button match the target design using CSS',
    quote:'<strong>Zen says:</strong> Every button tells a story. Make yours pop with color, padding, and rounded corners.',
    time:90,html:`<button class="box">Click Me</button>`,
    target:{'background-color':'#f472b6','color':'#ffffff','padding':'12px 28px','border-radius':'999px','border':'none','font-size':'16px','font-weight':'bold','cursor':'pointer'},
    hint:'Try: background-color, color, padding, border-radius, and border: none',points:300
  },
  {
    id:1,title:'Build a Card',desc:'Style this card with a background, border, shadow, and padding',
    quote:'<strong>Zen says:</strong> Cards are everywhere on the web. Master the box — background, border, shadow, and spacing.',
    time:100,html:`<div class="box"><h3>Zen's Lab</h3><p>Creative coding starts here.</p></div>`,
    target:{'background-color':'#1e1e35','color':'#e8e8f5','padding':'24px','border-radius':'12px','border':'1px solid #a855f7','box-shadow':'0 4px 24px rgba(168,85,247,0.25)','max-width':'280px','font-family':'sans-serif'},
    hint:'You need: background-color, color, padding, border-radius, border, box-shadow, and max-width',points:400
  },
  {
    id:2,title:'Flex Layout',desc:'Use flexbox to center the items and space them evenly',
    quote:'<strong>Zen says:</strong> Flexbox is your superpower. Learn to center things and you\'ll never fight a layout again.',
    time:120,html:`<div class="box"><span>HTML</span><span>CSS</span><span>JS</span></div>`,
    target:{'display':'flex','justify-content':'space-around','align-items':'center','background-color':'#0f0f1a','padding':'20px','border-radius':'8px','gap':'16px','max-width':'320px'},
    hint:'Key properties: display: flex, justify-content, align-items, gap',points:500
  }
];

let currentLevel=0,score=0,timer=null,timeLeft=0,hintUsed=false,levelComplete=false;

function initLevel(idx){
  const lvl=LEVELS[idx];
  levelComplete=false;hintUsed=false;
  document.getElementById('level-badge').textContent=`LEVEL ${idx+1}`;
  document.getElementById('level-title').textContent=lvl.title;
  document.getElementById('level-desc').textContent=lvl.desc;
  document.getElementById('zen-text').innerHTML=lvl.quote;
  LEVELS.forEach((_,i)=>{const d=document.getElementById(`dot-${i}`);d.className='dot'+(i<idx?' done':i===idx?' active':'');});
  renderTarget(lvl);
  document.getElementById('css-editor').value='';
  updatePreview('');setAccuracy(0);
  document.getElementById('match-status').textContent='';
  document.getElementById('hint-box').style.display='none';
  document.getElementById('hint-btn').className='hint-btn';
  document.getElementById('hint-btn').textContent='Use Hint (−50pts)';
  document.getElementById('btn-next').style.display='none';
  clearInterval(timer);timeLeft=lvl.time;updateTimer();
  timer=setInterval(tick,1000);
}

function renderTarget(lvl){
  const styles=Object.entries(lvl.target).map(([k,v])=>`${k}:${v}`).join(';');
  document.getElementById('target-preview').innerHTML=`<style>.tgt-box{${styles}}</style><div class="tgt-box">${lvl.html.replace(/class="box"/g,'class="tgt-box"')}</div>`;
}

function updatePreview(css){
  const lvl=LEVELS[currentLevel];
  document.getElementById('live-preview').innerHTML=`<style>.pv-box{${css}}.pv-box *{box-sizing:border-box;}</style><div class="pv-box">${lvl.html.replace(/class="box"/g,'class="pv-box"')}</div>`;
}

function tick(){timeLeft--;updateTimer();if(timeLeft<=0){clearInterval(timer);if(!levelComplete)showResult(false);}}
function updateTimer(){const el=document.getElementById('timer-val');el.textContent=timeLeft;el.className=timeLeft<=10?'danger':timeLeft<=20?'warning':'';}

document.getElementById('css-editor').addEventListener('input',function(){
  updatePreview(this.value);const acc=calcAccuracy(this.value);setAccuracy(acc);
  const ms=document.getElementById('match-status');
  if(acc>=85){ms.textContent='✓ Looking good!';ms.style.color='var(--green)';}else{ms.textContent='';}
});
document.getElementById('css-editor').addEventListener('keydown',function(e){
  if(e.key==='Tab'){e.preventDefault();const s=this.selectionStart;this.value=this.value.substring(0,s)+'  '+this.value.substring(this.selectionEnd);this.selectionStart=this.selectionEnd=s+2;}
});

function calcAccuracy(css){
  const lvl=LEVELS[currentLevel];const props=Object.entries(lvl.target);let matched=0;
  props.forEach(([prop,val])=>{const re=new RegExp(prop.replace('-','\\-')+'\\s*:\\s*'+val.replace(/[().,\s]/g,'.*'),'i');if(re.test(css))matched++;});
  return Math.round((matched/props.length)*100);
}

function setAccuracy(pct){
  document.getElementById('accuracy-fill').style.width=pct+'%';
  document.getElementById('accuracy-fill').style.background=pct>=80?'var(--green)':pct>=50?'var(--yellow)':'var(--accent)';
  document.getElementById('accuracy-pct').textContent=pct+'%';
}

function checkAnswer(){
  const css=document.getElementById('css-editor').value;const acc=calcAccuracy(css);setAccuracy(acc);
  const ms=document.getElementById('match-status');
  if(acc>=70){
    clearInterval(timer);levelComplete=true;
    const pts=Math.round(LEVELS[currentLevel].points*(acc/100))+Math.floor(timeLeft*2)-(hintUsed?50:0);
    score+=Math.max(0,pts);document.getElementById('score-val').textContent=score;
    ms.textContent=`✓ ${acc}% match — Level complete!`;ms.style.color='var(--green)';
    document.getElementById('btn-next').style.display='block';
    if(currentLevel===LEVELS.length-1)showResult(true);
  }else{ms.textContent=`✗ ${acc}% — Keep going, need 70%+`;ms.style.color='var(--red)';}
}

function showHint(){
  if(hintUsed)return;hintUsed=true;
  const h=document.getElementById('hint-box');h.innerHTML=`<strong>Hint:</strong> ${LEVELS[currentLevel].hint}`;h.style.display='block';
  const btn=document.getElementById('hint-btn');btn.textContent='Hint used';btn.classList.add('hint-used');
}

function resetLevel(){initLevel(currentLevel);}
function nextLevel(){if(currentLevel<LEVELS.length-1){currentLevel++;initLevel(currentLevel);}else showResult(true);}

function showResult(win){
  clearInterval(timer);
  document.getElementById('result-icon').textContent=win?'🌸':'💻';
  document.getElementById('result-title').textContent=win?'CHALLENGE COMPLETE':'TIME\'S UP';
  document.getElementById('result-title').className=`result-title ${win?'win':'fail'}`;
  document.getElementById('result-score').textContent=score+' pts';
  document.getElementById('result-msg').textContent=win?`You matched all 3 CSS challenges! Score: ${score} points. Real developers write CSS like this every day.`:`Time ran out — CSS takes practice. Every pro struggled with this too. Try again!`;
  document.getElementById('result-actions').innerHTML=`<button class="btn btn-secondary" onclick="restartGame()">Play Again</button><button class="btn btn-primary" onclick="window.location.href='games.html'">Back to Universe</button>`;
  document.getElementById('result-overlay').classList.add('show');
}

function restartGame(){score=0;currentLevel=0;document.getElementById('score-val').textContent='0';document.getElementById('result-overlay').classList.remove('show');initLevel(0);}
initLevel(0);
</script>
</body>
</html>
