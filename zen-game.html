<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zen's CSS Challenge — Method in Motion</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#07070f;
  --surface:#0f0f1a;
  --card:#131324;
  --border:#1e1e35;
  --text:#e8e8f5;
  --muted:#5a5a80;
  --pink:#f472b6;
  --cyan:#00f5d4;
  --purple:#a855f7;
  --yellow:#fbbf24;
  --green:#4ade80;
  --red:#f87171;
}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;overflow-x:hidden;}

/* NAV */
nav{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--border);background:var(--surface);}
.nav-left{display:flex;align-items:center;gap:16px;}
.nav-back{font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color 0.2s;}
.nav-back:hover{color:var(--pink);}
.nav-title{font-family:'Orbitron',monospace;font-size:0.75rem;letter-spacing:0.15em;color:var(--pink);}
.nav-tier{font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--purple);border:1px solid var(--purple);padding:3px 10px;border-radius:4px;opacity:0.8;}

/* GAME SHELL */
.game-shell{max-width:1200px;margin:0 auto;padding:28px 24px;}

/* LEVEL HEADER */
.level-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.level-info{display:flex;align-items:center;gap:16px;}
.level-badge{font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:0.15em;color:var(--cyan);border:1px solid rgba(0,245,212,0.3);padding:5px 14px;border-radius:4px;}
.level-title{font-size:1.1rem;font-weight:800;}
.level-desc{font-size:0.8rem;color:var(--muted);margin-top:2px;}
.score-bar{display:flex;align-items:center;gap:20px;}
.score-item{text-align:center;}
.score-val{font-family:'Orbitron',monospace;font-size:1.1rem;font-weight:900;color:var(--pink);}
.score-label{font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}
#timer-val{color:var(--cyan);}
#timer-val.warning{color:var(--yellow);}
#timer-val.danger{color:var(--red);animation:pulse 0.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}

/* MAIN GAME AREA */
.game-area{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}

/* TARGET PANEL */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.panel-header{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.panel-label{font-family:'Orbitron',monospace;font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);}
.panel-label span{color:var(--pink);}
.target-preview{padding:28px;display:flex;align-items:center;justify-content:center;min-height:220px;background:#fff;}

/* EDITOR PANEL */
.editor-wrap{position:relative;}
.editor-header{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.hint-btn{font-size:0.65rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);background:none;border:1px solid var(--border);padding:4px 12px;border-radius:4px;cursor:pointer;transition:all 0.2s;}
.hint-btn:hover{border-color:var(--cyan);color:var(--cyan);}
.hint-used{color:var(--red);border-color:rgba(248,113,113,0.3);}

.css-editor{width:100%;min-height:220px;background:#0a0a14;border:none;outline:none;padding:18px;font-family:'DM Mono',monospace;font-size:0.82rem;color:#e8e8f5;line-height:1.7;resize:none;tab-size:2;}
.css-editor::placeholder{color:var(--muted);}

/* LIVE PREVIEW */
.preview-panel{margin-bottom:20px;}
.live-preview{padding:28px;display:flex;align-items:center;justify-content:center;min-height:160px;background:#fff;border-radius:0 0 12px 12px;}

/* FEEDBACK BAR */
.feedback-bar{padding:12px 18px;border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;min-height:48px;}
.accuracy-label{font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}
.accuracy-track{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.accuracy-fill{height:100%;border-radius:3px;transition:width 0.3s,background 0.3s;width:0%;}
.accuracy-pct{font-family:'Orbitron',monospace;font-size:0.75rem;color:var(--text);min-width:40px;text-align:right;}

/* ACTION ROW */
.action-row{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;}
.btn{font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:0.12em;text-transform:uppercase;padding:11px 24px;border-radius:6px;cursor:pointer;border:none;transition:all 0.2s;}
.btn-primary{background:var(--pink);color:#000;font-weight:700;}
.btn-primary:hover{opacity:0.85;transform:translateY(-1px);}
.btn-secondary{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-secondary:hover{border-color:var(--pink);color:var(--pink);}
.btn-next{background:var(--cyan);color:#000;font-weight:700;display:none;}
.btn-next:hover{opacity:0.85;transform:translateY(-1px);}

/* HINT BOX */
.hint-box{display:none;background:rgba(168,85,247,0.08);border:1px solid rgba(168,85,247,0.25);border-radius:8px;padding:14px 18px;margin-bottom:16px;font-size:0.82rem;color:var(--text);line-height:1.7;}
.hint-box strong{color:var(--purple);}

/* RESULT OVERLAY */
.result-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;align-items:center;justify-content:center;}
.result-overlay.show{display:flex;}
.result-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;max-width:480px;width:90%;text-align:center;}
.result-icon{font-size:3rem;margin-bottom:16px;}
.result-title{font-family:'Orbitron',monospace;font-size:1.1rem;letter-spacing:0.1em;margin-bottom:8px;}
.result-title.win{color:var(--green);}
.result-title.fail{color:var(--red);}
.result-msg{font-size:0.9rem;color:var(--muted);line-height:1.7;margin-bottom:24px;}
.result-score{font-family:'Orbitron',monospace;font-size:2rem;font-weight:900;color:var(--pink);margin-bottom:24px;}
.result-actions{display:flex;gap:12px;justify-content:center;}

/* PROGRESS DOTS */
.progress-dots{display:flex;gap:8px;align-items:center;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:background 0.3s;}
.dot.active{background:var(--pink);}
.dot.done{background:var(--green);}

/* ZEN QUOTE */
.zen-quote{background:linear-gradient(135deg,rgba(244,114,182,0.06),rgba(168,85,247,0.06));border:1px solid rgba(244,114,182,0.15);border-radius:10px;padding:14px 20px;margin-bottom:20px;display:flex;align-items:center;gap:14px;}
.zen-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--purple));display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
.zen-text{font-size:0.82rem;color:var(--muted);line-height:1.6;font-style:italic;}
.zen-text strong{color:var(--pink);font-style:normal;}

@media(max-width:768px){
  .game-area{grid-template-columns:1fr;}
  .score-bar{gap:12px;}
}
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <a href="zen.html" class="nav-back">← Zen's World</a>
    <span class="nav-title">CSS Challenge</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="progress-dots" id="progress-dots">
      <div class="dot active" id="dot-0"></div>
      <div class="dot" id="dot-1"></div>
      <div class="dot" id="dot-2"></div>
    </div>
    <span class="nav-tier">Coders</span>
  </div>
</nav>

<div class="game-shell">

  <div class="zen-quote" id="zen-quote">
    <div class="zen-avatar">🌸</div>
    <div class="zen-text" id="zen-text">Loading challenge...</div>
  </div>

  <div class="level-header">
    <div class="level-info">
      <div class="level-badge" id="level-badge">LEVEL 1</div>
      <div>
        <div class="level-title" id="level-title">Loading...</div>
        <div class="level-desc" id="level-desc"></div>
      </div>
    </div>
    <div class="score-bar">
      <div class="score-item"><div class="score-val" id="timer-val">90</div><div class="score-label">Seconds</div></div>
      <div class="score-item"><div class="score-val" id="score-val">0</div><div class="score-label">Score</div></div>
    </div>
  </div>

  <div class="hint-box" id="hint-box"></div>

  <div class="game-area">
    <div class="panel">
      <div class="panel-header">
        <div class="panel-label"><span>TARGET</span> — Match this design</div>
      </div>
      <div class="target-preview" id="target-preview"></div>
    </div>

    <div class="panel editor-wrap">
      <div class="editor-header panel-header">
        <div class="panel-label"><span>YOUR CSS</span> — Write it here</div>
        <button class="hint-btn" id="hint-btn" onclick="showHint()">Use Hint (−50pts)</button>
      </div>
      <textarea class="css-editor" id="css-editor" placeholder="/* Write your CSS here */&#10;.box {&#10;  &#10;}" spellcheck="false"></textarea>
      <div class="feedback-bar">
        <span class="accuracy-label">Accuracy</span>
        <div class="accuracy-track"><div class="accuracy-fill" id="accuracy-fill"></div></div>
        <span class="accuracy-pct" id="accuracy-pct">0%</span>
      </div>
    </div>
  </div>

  <div class="panel preview-panel">
    <div class="panel-header">
      <div class="panel-label"><span>LIVE PREVIEW</span> — Updates as you type</div>
      <div id="match-status" style="font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);"></div>
    </div>
    <div class="live-preview" id="live-preview"></div>
  </div>

  <div class="action-row">
    <button class="btn btn-secondary" onclick="resetLevel()">Reset</button>
    <button class="btn btn-primary" onclick="checkAnswer()">Check Answer</button>
    <button class="btn btn-next" id="btn-next" onclick="nextLevel()">Next Level →</button>
  </div>

</div>

<!-- Result Overlay -->
<div class="result-overlay" id="result-overlay">
  <div class="result-box">
    <div class="result-icon" id="result-icon"></div>
    <div class="result-title" id="result-title"></div>
    <div class="result-score" id="result-score"></div>
    <div class="result-msg" id="result-msg"></div>
    <div class="result-actions" id="result-actions"></div>
  </div>
</div>

<script>
// ─── LEVELS ───────────────────────────────────────────────────────────────────
const LEVELS = [
  {
    id: 0,
    title: 'Style a Button',
    desc: 'Make the button match the target design using CSS',
    quote: '<strong>Zen says:</strong> Every button tells a story. Make yours pop with color, padding, and rounded corners.',
    time: 90,
    html: `<button class="box">Click Me</button>`,
    target: {
      'background-color': '#f472b6',
      'color': '#ffffff',
      'padding': '12px 28px',
      'border-radius': '999px',
      'border': 'none',
      'font-size': '16px',
      'font-weight': 'bold',
      'cursor': 'pointer',
    },
    targetCSS: `background-color: #f472b6;\ncolor: #ffffff;\npadding: 12px 28px;\nborder-radius: 999px;\nborder: none;\nfont-size: 16px;\nfont-weight: bold;\ncursor: pointer;`,
    hint: 'Try: background-color, color, padding, border-radius, and border: none',
    points: 300,
  },
  {
    id: 1,
    title: 'Build a Card',
    desc: 'Style this card with a background, border, shadow, and padding',
    quote: '<strong>Zen says:</strong> Cards are everywhere on the web. Master the box — background, border, shadow, and spacing.',
    time: 100,
    html: `<div class="box"><h3>Zen's Lab</h3><p>Creative coding starts here.</p></div>`,
    target: {
      'background-color': '#1e1e35',
      'color': '#e8e8f5',
      'padding': '24px',
      'border-radius': '12px',
      'border': '1px solid #a855f7',
      'box-shadow': '0 4px 24px rgba(168,85,247,0.25)',
      'max-width': '280px',
      'font-family': 'sans-serif',
    },
    targetCSS: `background-color: #1e1e35;\ncolor: #e8e8f5;\npadding: 24px;\nborder-radius: 12px;\nborder: 1px solid #a855f7;\nbox-shadow: 0 4px 24px rgba(168,85,247,0.25);\nmax-width: 280px;\nfont-family: sans-serif;`,
    hint: 'You need: background-color, color, padding, border-radius, border, box-shadow, and max-width',
    points: 400,
  },
  {
    id: 2,
    title: 'Flex Layout',
    desc: 'Use flexbox to center the items and space them evenly',
    quote: '<strong>Zen says:</strong> Flexbox is your superpower. Learn to center things and you\'ll never fight a layout again.',
    time: 120,
    html: `<div class="box"><span>HTML</span><span>CSS</span><span>JS</span></div>`,
    target: {
      'display': 'flex',
      'justify-content': 'space-around',
      'align-items': 'center',
      'background-color': '#0f0f1a',
      'padding': '20px',
      'border-radius': '8px',
      'gap': '16px',
      'max-width': '320px',
    },
    targetCSS: `display: flex;\njustify-content: space-around;\nalign-items: center;\nbackground-color: #0f0f1a;\npadding: 20px;\nborder-radius: 8px;\ngap: 16px;\nmax-width: 320px;`,
    hint: 'Key properties: display: flex, justify-content, align-items, gap',
    points: 500,
  }
];

// ─── STATE ────────────────────────────────────────────────────────────────────
let currentLevel = 0;
let score = 0;
let timer = null;
let timeLeft = 0;
let hintUsed = false;
let levelComplete = false;

// ─── INIT ─────────────────────────────────────────────────────────────────────
function initLevel(idx) {
  const lvl = LEVELS[idx];
  levelComplete = false;
  hintUsed = false;

  // Header
  document.getElementById('level-badge').textContent = `LEVEL ${idx + 1}`;
  document.getElementById('level-title').textContent = lvl.title;
  document.getElementById('level-desc').textContent = lvl.desc;
  document.getElementById('zen-text').innerHTML = lvl.quote;

  // Dots
  LEVELS.forEach((_, i) => {
    const dot = document.getElementById(`dot-${i}`);
    dot.className = 'dot' + (i < idx ? ' done' : i === idx ? ' active' : '');
  });

  // Target preview
  renderTarget(lvl);

  // Editor
  const editor = document.getElementById('css-editor');
  editor.value = '';
  editor.placeholder = `/* Style the .box element */\n.box {\n  \n}`;

  // Live preview
  updatePreview('');

  // Feedback
  setAccuracy(0);
  document.getElementById('match-status').textContent = '';
  document.getElementById('hint-box').style.display = 'none';
  document.getElementById('hint-btn').className = 'hint-btn';
  document.getElementById('hint-btn').textContent = 'Use Hint (−50pts)';
  document.getElementById('btn-next').style.display = 'none';

  // Timer
  clearInterval(timer);
  timeLeft = lvl.time;
  updateTimer();
  timer = setInterval(tick, 1000);
}

function renderTarget(lvl) {
  const preview = document.getElementById('target-preview');
  const styles = Object.entries(lvl.target).map(([k,v]) => `${k}:${v}`).join(';');
  preview.innerHTML = `<style>.tgt-box{${styles}}</style><div class="tgt-box">${lvl.html.replace(/class="box"/g, 'class="tgt-box"')}</div>`;
}

function updatePreview(css) {
  const preview = document.getElementById('live-preview');
  const lvl = LEVELS[currentLevel];
  preview.innerHTML = `<style>.pv-box{${css}}.pv-box *{box-sizing:border-box;}</style><div class="pv-box">${lvl.html.replace(/class="box"/g,'class="pv-box"')}</div>`;
}

// ─── TIMER ────────────────────────────────────────────────────────────────────
function tick() {
  timeLeft--;
  updateTimer();
  if (timeLeft <= 0) {
    clearInterval(timer);
    if (!levelComplete) timeUp();
  }
}

function updateTimer() {
  const el = document.getElementById('timer-val');
  el.textContent = timeLeft;
  el.className = timeLeft <= 10 ? 'danger' : timeLeft <= 20 ? 'warning' : '';
}

// ─── EDITOR ───────────────────────────────────────────────────────────────────
document.getElementById('css-editor').addEventListener('input', function() {
  const css = this.value;
  updatePreview(css);
  const acc = calcAccuracy(css);
  setAccuracy(acc);
  if (acc >= 85) {
    document.getElementById('match-status').textContent = '✓ Looking good!';
    document.getElementById('match-status').style.color = 'var(--green)';
  } else {
    document.getElementById('match-status').textContent = '';
  }
});

document.getElementById('css-editor').addEventListener('keydown', function(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = this.selectionStart, end = this.selectionEnd;
    this.value = this.value.substring(0, s) + '  ' + this.value.substring(end);
    this.selectionStart = this.selectionEnd = s + 2;
  }
});

// ─── ACCURACY ─────────────────────────────────────────────────────────────────
function calcAccuracy(css) {
  const lvl = LEVELS[currentLevel];
  const props = Object.entries(lvl.target);
  let matched = 0;
  props.forEach(([prop, val]) => {
    const re = new RegExp(prop.replace('-','\\-') + '\\s*:\\s*' + val.replace(/[().,\s]/g, '.*'), 'i');
    if (re.test(css)) matched++;
  });
  return Math.round((matched / props.length) * 100);
}

function setAccuracy(pct) {
  const fill = document.getElementById('accuracy-fill');
  const pctEl = document.getElementById('accuracy-pct');
  fill.style.width = pct + '%';
  fill.style.background = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--yellow)' : 'var(--pink)';
  pctEl.textContent = pct + '%';
}

// ─── CHECK ────────────────────────────────────────────────────────────────────
function checkAnswer() {
  const css = document.getElementById('css-editor').value;
  const acc = calcAccuracy(css);
  setAccuracy(acc);

  if (acc >= 70) {
    clearInterval(timer);
    levelComplete = true;
    const timeBonus = Math.floor(timeLeft * 2);
    const hintPenalty = hintUsed ? 50 : 0;
    const lvlPoints = Math.round(LEVELS[currentLevel].points * (acc / 100)) + timeBonus - hintPenalty;
    score += Math.max(0, lvlPoints);
    document.getElementById('score-val').textContent = score;
    document.getElementById('match-status').textContent = `✓ ${acc}% match — Level complete!`;
    document.getElementById('match-status').style.color = 'var(--green)';
    document.getElementById('btn-next').style.display = 'block';

    if (currentLevel === LEVELS.length - 1) {
      showResult(true);
    }
  } else {
    document.getElementById('match-status').textContent = `✗ ${acc}% — Keep going, you need 70%+`;
    document.getElementById('match-status').style.color = 'var(--red)';
  }
}

// ─── HINT ─────────────────────────────────────────────────────────────────────
function showHint() {
  if (hintUsed) return;
  hintUsed = true;
  const lvl = LEVELS[currentLevel];
  const hintEl = document.getElementById('hint-box');
  hintEl.innerHTML = `<strong style="color:var(--purple)">Hint:</strong> ${lvl.hint}`;
  hintEl.style.display = 'block';
  const btn = document.getElementById('hint-btn');
  btn.textContent = 'Hint used';
  btn.classList.add('hint-used');
}

// ─── RESET ────────────────────────────────────────────────────────────────────
function resetLevel() {
  initLevel(currentLevel);
}

// ─── NEXT ─────────────────────────────────────────────────────────────────────
function nextLevel() {
  if (currentLevel < LEVELS.length - 1) {
    currentLevel++;
    initLevel(currentLevel);
  } else {
    showResult(true);
  }
}

// ─── TIME UP ──────────────────────────────────────────────────────────────────
function timeUp() {
  showResult(false);
}

// ─── RESULT ───────────────────────────────────────────────────────────────────
function showResult(win) {
  clearInterval(timer);
  const overlay = document.getElementById('result-overlay');
  document.getElementById('result-icon').textContent = win ? '🌸' : '💻';
  document.getElementById('result-title').textContent = win ? 'CHALLENGE COMPLETE' : 'TIME\'S UP';
  document.getElementById('result-title').className = `result-title ${win ? 'win' : 'fail'}`;
  document.getElementById('result-score').textContent = score + ' pts';
  document.getElementById('result-msg').textContent = win
    ? `You matched all 3 CSS challenges! Your score: ${score} points. Real developers write CSS like this every day — and now you do too.`
    : `Time ran out, but don't stop. CSS takes practice. Every professional struggled with this too. Try again!`;
  document.getElementById('result-actions').innerHTML = `
    <button class="btn btn-secondary" onclick="restartGame()">Play Again</button>
    <button class="btn btn-primary" onclick="window.location.href='zen.html'">Back to Zen</button>
  `;
  overlay.classList.add('show');
}

function restartGame() {
  score = 0;
  currentLevel = 0;
  document.getElementById('score-val').textContent = '0';
  document.getElementById('result-overlay').classList.remove('show');
  initLevel(0);
}

// ─── START ────────────────────────────────────────────────────────────────────
initLevel(0);
</script>
</body>
</html>
