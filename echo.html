<style>
:root {

}
* { box-sizing: border-box; margin: 0; padding: 0; }

nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; height: 60px; background: rgba(4, 6, 15, 0.95); border-bottom: 1px solid var(--border); backdrop-filter: blur(10px); }

.hero-catchphrase { display: inline-block; font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--purple); background: rgba(124,77,255,0.1); border: 1px solid rgba(124,77,255,0.3); padding: 0.3rem 0.8rem; border-radius: 100px; margin-bottom: 1rem; }

.hero-tiles { display: flex; gap: 0.6rem; flex-wrap: wrap; }

.hero-tile:hover { background: rgba(0, 229, 255, 0.16); border-color: var(--cyan); color: var(--cyan); box-shadow: var(--glow); }

.lesson-tab { flex-shrink: 0; padding: 0.9rem 1.6rem; font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; user-select: none; background: none; border-top: none; border-left: none; border-right: none; }

.lesson-content { padding: 2.5rem 3rem; max-width: 900px; }
.content-block { display: none; }
.content-block.active { display: block; }
.section-header { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: 0.4rem; }
