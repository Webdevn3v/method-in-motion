<style>
:root {
  --pink: #ff6baa;
  --pink-dim: #e0568f;
  --purple: #c66bff;
  --purple-dim: #a34fe0;
  --bg: #0a0512;
  --bg-mid: #120a1e;
  --bg-card: #150c22;
  --bg-panel: #0d0718;
  --text: #f5e8f5;
  --text-dim: #b083c4;
  --text-muted: #5a3a6e;
  --border: rgba(255,107,170,0.15);
  --border-bright: rgba(255,107,170,0.4);
  --border-purple: rgba(198,107,255,0.3);
  --glow: 0 0 18px rgba(255,107,170,0.3);
  --glow-strong: 0 0 36px rgba(255,107,170,0.55);
  --font-display: 'Orbitron', monospace;
  --font-body: 'Space Grotesk', sans-serif;
  --font-mono: 'Space Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; height: 60px; background: rgba(10,5,18,0.96); border-bottom: 1px solid var(--border); backdrop-filter: blur(10px); }
.nav-logo { font-family: var(--font-display); font-size: 0.85rem; font-weight: 700; color: var(--pink); text-decoration: none; letter-spacing: 0.1em; }
.nav-links { display: flex; align-items: center; gap: 1.5rem; list-style: none; }
.nav-links a { font-family: var(--font-body); font-size: 0.82rem; font-weight: 500; color: var(--text-dim); text-decoration: none; letter-spacing: 0.05em; transition: color 0.2s; }
.nav-links a:hover { color: var(--pink); }
.nav-user { font-family: var(--font-mono); font-size: 0.75rem; color: var(--pink); display: none; }
.nav-logout { background: none; border: 1px solid var(--border); color: var(--text-dim); font-family: var(--font-body); font-size: 0.78rem; padding: 0.3rem 0.8rem; border-radius: 4px; cursor: pointer; transition: all 0.2s; display: none; }
.nav-logout:hover { border-color: var(--pink); color: var(--pink); }

.hero { margin-top: 60px; min-height: 640px; position: relative; overflow: hidden; display: flex; align-items: flex-end; }
.hero-layer { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.4s ease; transform: scale(1.03); animation: heroBreathe 9s ease-in-out infinite; }
.hero-layer.active { opacity: 1; }
.hero-layer[data-state="room"] { background-image: url('zen-world-interior.png'); }
.hero-layer[data-state="universe"] { background-image: url('zen-mim-uni-portal.png'); }
.hero-layer[data-state="underground"] { background-image: url('zen-mim-underground.png'); }
@keyframes heroBreathe { 0%, 100% { transform: scale(1.03); } 50% { transform: scale(1.065); } }
.hero-gradient { position: absolute; inset: 0; z-index: 2; background: linear-gradient(to top, rgba(10,5,18,0.96) 0%, rgba(10,5,18,0.55) 32%, rgba(10,5,18,0.05) 60%, transparent 100%), linear-gradient(to right, rgba(10,5,18,0.75) 0%, rgba(10,5,18,0.15) 45%, transparent 75%); pointer-events: none; }
.hero-pulse { position: absolute; inset: 0; z-index: 3; pointer-events: none; background: radial-gradient(ellipse 60% 50% at 68% 45%, rgba(198,107,255,0.16) 0%, transparent 65%); animation: pulseGlow 5s ease-in-out infinite; }
@keyframes pulseGlow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

.particle-field { position: absolute; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
.particle { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 8px 2px rgba(255,107,170,0.6); opacity: 0; animation: floatUp linear infinite; }
.particle:nth-child(odd) { background: var(--purple); box-shadow: 0 0 8px 2px rgba(198,107,255,0.6); }
@keyframes floatUp { 0% { transform: translateY(0) translateX(0); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.4; } 100% { transform: translateY(-380px) translateX(20px); opacity: 0; } }

/* ═══════════ PORTAL ORBS — real links, positioned over the doorway ═══════════ */
.portal-orb {
  position: absolute;
  z-index: 20;
  width: 64px; height: 64px;
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  background: rgba(10,5,18,0.35);
  backdrop-filter: blur(3px);
  border: 2px solid;
  transition: all 0.35s ease;
  animation: orbPulse 2.6s ease-in-out infinite;
}
.portal-orb .orb-icon { font-size: 1.3rem; line-height: 1; }
.portal-orb .orb-label { font-family: var(--font-mono); font-size: 0.42rem; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; opacity: 0.9; }
.portal-orb-universe { top: 24%; right: 20%; border-color: rgba(0,229,255,0.6); box-shadow: 0 0 18px rgba(0,229,255,0.35); }
.portal-orb-universe .orb-icon, .portal-orb-universe .orb-label { color: #7fe8ff; }
.portal-orb-underground { top: 44%; right: 20%; border-color: var(--border-bright); box-shadow: 0 0 18px rgba(255,107,170,0.35); }
.portal-orb-underground .orb-icon, .portal-orb-underground .orb-label { color: var(--pink); }
.portal-orb:hover { transform: scale(1.18); }
.portal-orb-universe:hover { box-shadow: 0 0 32px rgba(0,229,255,0.7); }
.portal-orb-underground:hover { box-shadow: 0 0 32px rgba(255,107,170,0.7); }
@keyframes orbPulse { 0%,100% { box-shadow: 0 0 14px currentColor; } 50% { box-shadow: 0 0 26px currentColor; } }
.portal-orb.traveling { animation: orbTravel 0.9s ease forwards; }
@keyframes orbTravel { 0% { transform: scale(1); } 60% { transform: scale(1.6); opacity: 1; } 100% { transform: scale(2.4); opacity: 0; } }

.hotspot { position: absolute; z-index: 15; cursor: pointer; border-radius: 50%; border: 1px solid rgba(255,107,170,0.5); background: rgba(255,107,170,0.08); animation: hotspotPulse 2.4s ease-in-out infinite; transition: all 0.25s ease; }
.hotspot:hover { background: rgba(255,107,170,0.25); border-color: var(--pink); box-shadow: var(--glow); transform: scale(1.15); }
.hotspot::after { content: attr(data-label); position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.06em; color: var(--pink); background: rgba(10,5,18,0.92); border: 1px solid var(--border-bright); padding: 0.3rem 0.6rem; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
.hotspot:hover::after { opacity: 1; }
@keyframes hotspotPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,170,0.35); } 50% { box-shadow: 0 0 0 8px rgba(255,107,170,0); } }
.hs-desk { width: 46px; height: 46px; left: 10%; top: 58%; }
.hs-companion-spot { width: 40px; height: 40px; left: 46%; top: 22%; }

.hero-content { position: relative; z-index: 10; padding: 3rem 3rem 3.5rem; max-width: 620px; }
.hero-eyebrow { font-family: var(--font-mono); font-size: 0.7rem; color: var(--pink); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 1rem; opacity: 0.9; text-shadow: 0 0 12px rgba(255,107,170,0.6); }
.hero-name { font-family: var(--font-display); font-size: clamp(2.8rem, 6vw, 4.5rem); font-weight: 900; color: #fff; line-height: 0.95; text-shadow: var(--glow-strong); margin-bottom: 0.4rem; }
.hero-catchphrase { display: inline-block; font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--purple); background: rgba(198,107,255,0.12); border: 1px solid var(--border-purple); padding: 0.3rem 0.8rem; border-radius: 100px; margin-bottom: 1rem; backdrop-filter: blur(4px); }
.hero-role { font-family: var(--font-display); font-size: clamp(0.75rem, 1.5vw, 0.95rem); font-weight: 600; color: var(--pink); letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 1.2rem; }
.hero-quote { font-size: 1.05rem; color: var(--text-dim); line-height: 1.6; max-width: 460px; margin-bottom: 1.5rem; font-style: italic; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
.hero-quote span { color: var(--pink); font-style: normal; font-weight: 600; }
.fact-ticker { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-dim); max-width: 460px; min-height: 32px; margin-bottom: 1.5rem; line-height: 1.5; opacity: 0; transition: opacity 0.5s; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
.fact-ticker.show { opacity: 1; }
.fact-ticker::before { content: '✦ DID YOU KNOW — '; color: var(--purple); }
.hero-tiles { display: flex; gap: 0.6rem; flex-wrap: wrap; }
.hero-tile { background: rgba(255,107,170,0.08); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem 1rem; font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-dim); cursor: pointer; transition: all 0.2s; text-decoration: none; display: block; backdrop-filter: blur(4px); }
.hero-tile:hover { background: rgba(255,107,170,0.18); border-color: var(--pink); color: var(--pink); box-shadow: var(--glow); transform: translateY(-2px); }

.click-ripple { position: fixed; z-index: 400; border-radius: 50%; border: 2px solid var(--pink); pointer-events: none; animation: rippleOut 0.6s ease-out forwards; }
@keyframes rippleOut { from { width: 0; height: 0; opacity: 1; } to { width: 80px; height: 80px; margin-left: -40px; margin-top: -40px; opacity: 0; } }

.lesson-tab { flex-shrink: 0; padding: 0.9rem 1.6rem; font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; user-select: none; background: none; border-top: none; border-left: none; border-right: none; }
.lesson-tab:hover { color: var(--pink); }
.lesson-tab.active { color: var(--pink); border-bottom-color: var(--pink); text-shadow: 0 0 8px rgba(255,107,170,0.5); }

.lesson-panel { display: none; }
.lesson-panel.open { display: grid; grid-template-columns: 220px 1fr; min-height: 80vh; }

.lesson-sidebar { background: var(--bg-panel); border-right: 1px solid var(--border); padding: 2rem 1.2rem; position: sticky; top: calc(60px + 42px); height: calc(100vh - 102px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.sidebar-label { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-muted); letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
.sidebar-nav-btn { width: 100%; background: none; border: none; text-align: left; padding: 0.65rem 0.8rem; margin-bottom: 0.2rem; border-radius: 6px; font-family: var(--font-body); font-size: 0.82rem; color: var(--text-dim); cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
.sidebar-nav-btn:hover { background: rgba(255,107,170,0.07); color: var(--pink); }
.sidebar-nav-btn.active { background: rgba(255,107,170,0.11); color: var(--pink); font-weight: 600; }
.sidebar-icon { font-size: 0.9rem; }

.lesson-content { padding: 2.5rem 3rem; max-width: 900px; }
.content-block { display: none; }
.content-block.active { display: block; }
.section-header { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: 0.4rem; }
.section-sub { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 2rem; font-family: var(--font-mono); letter-spacing: 0.05em; }
